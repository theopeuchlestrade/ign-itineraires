name: Dependency vulnerability scan

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * *"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-private:
    if: github.repository_visibility != 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the lockfile without SARIF upload
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --lockfile=package-lock.json

  scan-scheduled:
    if: >-
      github.repository_visibility == 'public' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pubspec.lock
        --lockfile=package-lock.json
